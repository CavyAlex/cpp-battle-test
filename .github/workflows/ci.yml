name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Ubuntu, clang ${{ matrix.clang }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Минимальная версия из требований задания
          - os: ubuntu-22.04
            clang: 15
          - os: ubuntu-24.04
            clang: 18
    steps:
      - uses: actions/checkout@v5

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang-${{ matrix.clang }}

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_CXX_COMPILER=clang++-${{ matrix.clang }}
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_FLAGS=-Werror

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure
